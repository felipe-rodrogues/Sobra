name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🧪 Executar Testes Automatizados
        run: npm test

      - name: 🔨 Compilar Aplicação Web (Vite)
        run: npm run build

      - name: 🔄 Sincronizar com Projeto Android (Capacitor)
        run: npx cap sync android

      - name: 🔑 Dar Permissão de Execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: Sobra-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
